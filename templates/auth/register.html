<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SecurePass</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="auth-form">
            <div class="form-header">
                <h1>🔐 SecurePass</h1>
                <h2>Create Your Account</h2>
                <p>Register with biometric authentication - no passwords needed!</p>
            </div>
            
            <form id="registerForm" class="form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <button type="submit" class="btn btn-primary" id="registerBtn">
                    <span class="btn-icon">🔒</span>
                    Register with Biometrics
                </button>
            </form>
            
            <div id="status" class="status-message"></div>
            
            <div class="form-footer">
                <p>Already have an account? <a href="/login">Login here</a></p>
                <p><a href="/">← Back to Home</a></p>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='webauthn.js') }}"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const statusDiv = document.getElementById('status');
            const registerBtn = document.getElementById('registerBtn');
            
            if (!name || !email) {
                showStatus('Please fill in all fields', 'error');
                return;
            }
            
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="btn-icon">⏳</span> Registering...';
            
            try {
                const result = await registerUser(name, email);
                if (result.success) {
                    showStatus('Registration successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showStatus(result.error || 'Registration failed', 'error');
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = '<span class="btn-icon">🔒</span> Register with Biometrics';
                }
            } catch (error) {
                showStatus('Registration failed: ' + error.message, 'error');
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<span class="btn-icon">🔒</span> Register with Biometrics';
            }
        });
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status-message ${type}`;
        }
    </script>
</body>
</html>
